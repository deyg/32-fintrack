name: FinTrack - .NET build, migrations and tests

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore EF local tool
        run: dotnet tool restore
      - name: Restore solution
        run: dotnet restore FinTrack.slnx
      - name: Build
        run: dotnet build FinTrack.slnx --no-restore --configuration Release
      - name: Check EF model and migration consistency
        run: dotnet ef migrations has-pending-model-changes --project src/FinTrack.Infrastructure --startup-project src/FinTrack.Infrastructure
      - name: Unit and HTTP integration tests
        run: dotnet test FinTrack.slnx --no-build --configuration Release --logger 'trx;LogFileName=tests.trx'
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fintrack-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
