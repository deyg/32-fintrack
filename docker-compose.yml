services:
  migracoes:
    build:
      context: .
      target: migrator
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FinTrack: Data Source=/dados/fintrack.db
    volumes:
      - fintrack-dados:/dados
    restart: "no"

  api:
    build:
      context: .
      target: final
    depends_on:
      migracoes:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FinTrack: Data Source=/dados/fintrack.db
    ports:
      - "8080:8080"
    volumes:
      - fintrack-dados:/dados

volumes:
  fintrack-dados:
